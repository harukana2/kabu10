name: 株スクリーニング定期実行（取引時間中10分おき）

on:
  schedule:
    # UTC基準。JST 9:00-15:00 = UTC 0:00-6:00
    # 0:00〜5:50まで10分おき + 6:00ちょうど（=JST15:00）
    #- cron: '*/10 0-5 * * 1-5'
    #- cron: '0 6 * * 1-5'
    - cron: '30 * * * 0,5,6'
  workflow_dispatch: {}   # 手動実行もできるようにしておく

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy yfinance openpyxl
      - env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python kabu_screener_v2.py
